# Vite builds into build/ (see vite.config.mjs). Netlify installs the
# dependencies itself; .npmrc carries the install flags.
[build]
  publish = "build"
  command = "npm run build"

# Vite 6 and Vitest 4 need Node 20 or later.
[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response.
# Scripts, styles, images and map data are all served from this site. The one
# exception is the photo of the viewer's city in the sidebar, which comes from
# Wikipedia: its API (en.wikipedia.org) and its image hosts (thumb.wikimedia.org,
# upload.wikimedia.org). Inline styles are allowed because React
# sets element styles (positions, sizes); inline scripts are not.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://thumb.wikimedia.org https://upload.wikimedia.org; font-src 'self'; connect-src 'self' https://en.wikipedia.org; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Fingerprinted build assets (Vite's assetsDir) never change.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
